name: Build Api
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/CounterApi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Packages
        run: dotnet restore
      - name: Build API
        run: dotnet build --no-restore

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build

  build-application-image:
    runs-on: ubuntu-latest
    needs: build-api
    environment: Production
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2  
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2    
    - name: Build and Push API Image
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}

        docker build -t dotnet-counter-api ./api/CounterApi

        docker tag \
          dotnet-counter-api:latest \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-api:$IMAGE_TAG

        docker tag \
          dotnet-counter-api:latest \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-api:latest

        docker push \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-api:$IMAGE_TAG
        
        docker push \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-api:latest

  build-frontend-image:
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: Production
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2  
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and Push Frontend Image
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}
        docker build -t dotnet-counter-frontend ./frontend

        docker tag \
          dotnet-counter-frontend:latest \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-frontend:$IMAGE_TAG

        docker tag \
          dotnet-counter-frontend:latest \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-frontend:latest

        docker push \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-frontend:$IMAGE_TAG

        docker push \
          123677443445.dkr.ecr.ap-southeast-2.amazonaws.com/dotnet-counter-frontend:latest